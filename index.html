<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-HW46CWtJM2VuFZUVEfzhS6hO2QOx6BeLjuFMZPR1TKo='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">

<title>مهام الالتزام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#14302b; --muted:#5d716c; --line:#d5ddda;
  --accent:#0f6b5c; --accent-ink:#ffffff; --chip:#e1e9e6;
  --crit:#b3261e; --crit-bg:#fbe9e7; --warn:#8a5a00; --warn-bg:#fdf1d8; --ok:#1d6b3a; --ok-bg:#e3f3e8;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1715; --surface:#14211e; --ink:#e3ece9; --muted:#93a8a2; --line:#263733;
  --accent:#4fbfa8; --accent-ink:#06201b; --chip:#1c2d29;
  --crit:#ff8a80; --crit-bg:#3a1714; --warn:#f2c160; --warn-bg:#332611; --ok:#7fd69a; --ok-bg:#12301d; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;line-height:1.3;text-wrap:balance}
.dates{color:var(--muted);font-size:13px}
.dates b{color:var(--ink);font-weight:600}
.status{font-size:12px;color:var(--muted);min-height:1.2em}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:right;font:inherit;color:inherit}
.stat:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat .n{font-family:var(--f-num);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums;display:block}
.stat .l{font-size:12px;color:var(--muted)}
.stat.crit .n{color:var(--crit)} .stat.warn .n{color:var(--warn)}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group h2{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.group h2 small{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:8px;background:var(--ok)}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)}
.body{min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.tag{background:var(--chip);border-radius:4px;padding:0 6px}
.tag.high{background:var(--crit-bg);color:var(--crit)}
.num{font-family:var(--f-num)}
.notes{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere;white-space:pre-line}
.days{font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums;border-radius:4px;padding:2px 8px;white-space:nowrap;text-align:center}
.days.crit{background:var(--crit-bg);color:var(--crit)} .days.warn{background:var(--warn-bg);color:var(--warn)} .days.ok{background:var(--ok-bg);color:var(--ok)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.ro{font-size:12px;color:var(--muted);text-align:center;margin:0}
.lock{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:14px}
.lock h1{font-size:22px}
.lock p{margin:0;color:var(--muted);font-size:13px}
.lock label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.lock input{font:inherit;font-family:var(--f-num);font-size:16px;letter-spacing:.04em;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%;direction:ltr;text-align:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:13px;min-height:1.3em;margin:0}
@media (max-width:480px){.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<form class="lock" id="lock" autocomplete="off">
  <h1>مهام الالتزام</h1>
  <p>الصفحة محمية. أدخل رمز الدخول لعرض المهام.</p>
  <label for="code">رمز الدخول<input id="code" type="password" required autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"></label>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" id="go" type="submit">دخول</button>
  <p class="ro">هذه الحقوق محفوظة لعبدالملك بن عبدالله العمار</p>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <div><h1>مهام الالتزام</h1><div class="dates" id="dates"></div></div>
    <div class="status" id="status"></div>
  </header>
  <div class="strip">
    <button class="stat crit" type="button" data-f="overdue" aria-pressed="false"><span class="n" id="n-overdue">–</span><span class="l">متأخرة</span></button>
    <button class="stat warn" type="button" data-f="today" aria-pressed="false"><span class="n" id="n-today">–</span><span class="l">اليوم</span></button>
    <button class="stat" type="button" data-f="week" aria-pressed="false"><span class="n" id="n-week">–</span><span class="l">خلال 7 أيام</span></button>
    <button class="stat" type="button" data-f="month" aria-pressed="false"><span class="n" id="n-month">–</span><span class="l">خلال 30 يوم</span></button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="groups"></div>
  <p class="ro">للاطلاع فقط · لا يمكن التعديل من هذه الصفحة</p>
  <p class="ro">هذه الحقوق محفوظة لعبدالملك بن عبدالله العمار</p>
</div>

const CATS={req:"طلبات الهيئة",reg:"تقارير رقابية",circ:"تعاميم",noc:"عدم ممانعة",claims:"مطالبات",aml:"AML/CTF",gov:"حوكمة",daily:"متابعة يومية",other:"أخرى"};
const REP={daily:"يومي",monthly:"شهري",quarterly:"ربع سنوي",yearly:"سنوي"};
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let tasks=[],cat="all",win=null,fails=0;

async function unlock(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
$("lock").addEventListener("submit",async e=>{
  e.preventDefault();const btn=$("go"),code=$("code").value;if(!code)return;
  btn.disabled=true;btn.textContent="جارٍ التحقق…";$("err").textContent="";
  try{const d=await unlock(code);$("code").value="";tasks=d.tasks;$("status").textContent="آخر تحديث: "+d.updated;
    $("lock").hidden=true;$("app").hidden=false;start()}
  catch(_){fails++;$("err").textContent="الرمز غير صحيح.";$("code").select();
    const wait=Math.min(30,2**fails);btn.textContent="انتظر "+wait+" ث";
    await new Promise(r=>setTimeout(r,wait*1000));}
  btn.disabled=false;btn.textContent="دخول";
});

const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(new Date());
const pd=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const fmt=ms=>new Date(ms).toISOString().slice(0,10);
const diff=(due,t)=>Math.round((pd(due)-pd(t))/864e5);
function addMonths(s,n){const y=+s.slice(0,4),m=+s.slice(5,7)-1+n,d=+s.slice(8,10);const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return fmt(Date.UTC(y,m,Math.min(d,last)))}
function curDue(t,now){let d=t.due;if(!t.repeat||t.repeat==="none")return d;if(t.repeat==="daily")return d<now?now:d;
  const s={monthly:1,quarterly:3,yearly:12}[t.repeat];while(d<now)d=addMonths(d,s);return d}
function bucket(t,now){if(t.done)return"done";const n=diff(t._due,now);if(n<0)return"overdue";if(n===0)return"today";if(n<=7)return"week";if(n<=30)return"month";return"later"}
const dayLabel=n=>n<0?"متأخرة "+(-n)+" يوم":n===0?"اليوم":n===1?"غداً":"باقي "+n+" يوم";
const dayCls=n=>n<=0?"crit":n<=7?"warn":"ok";
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

function renderDates(){const d=new Date();
  const g=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Riyadh"}).format(d);
  let h="";try{h=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Riyadh"}).format(d)}catch(e){}
  const x=$("dates");x.textContent="";x.append(el("b",null,g),document.createTextNode(h?" · "+h:""))}

function row(t,now){
  const n=diff(t._due,now),r=el("div","row"+(t.done?" done":""));
  r.append(el("span","dot "+(t.done?"":dayCls(n))));
  const body=el("div","body");body.append(el("div","t",t.title));
  const meta=el("div","meta");meta.append(el("span","tag",CATS[t.cat]||"أخرى"));
  if(t.prio==="high")meta.append(el("span","tag high","أولوية عالية"));
  if(t.repeat&&t.repeat!=="none")meta.append(el("span","tag","↻ "+REP[t.repeat]));
  meta.append(el("span","num",t._due));if(t.ref)meta.append(el("span",null,"المرجع: "+t.ref));
  body.append(meta);if(t.notes)body.append(el("div","notes",t.notes));
  r.append(body,el("span","days "+(t.done?"ok":dayCls(n)),t.done?"منجزة":dayLabel(n)));return r}

function render(){
  const now=today();tasks.forEach(t=>t._due=curDue(t,now));
  const open=tasks.filter(t=>!t.done),cnt={overdue:0,today:0,week:0,month:0};
  open.forEach(t=>{const n=diff(t._due,now);if(n<0)cnt.overdue++;else if(n===0)cnt.today++;if(n>=0&&n<=7)cnt.week++;if(n>=0&&n<=30)cnt.month++});
  Object.keys(cnt).forEach(k=>$("n-"+k).textContent=cnt[k]);
  document.querySelectorAll(".stat").forEach(b=>b.setAttribute("aria-pressed",String(win===b.dataset.f)));
  const c=$("chips");c.textContent="";const counts={};open.forEach(t=>counts[t.cat]=(counts[t.cat]||0)+1);
  [["all","الكل"],...Object.entries(CATS).filter(([k])=>counts[k])].forEach(([k,l])=>{const b=el("button","chip",l+(k==="all"?"":" "+counts[k]));
    b.type="button";b.setAttribute("aria-pressed",String(cat===k));b.addEventListener("click",()=>{cat=k;render()});c.append(b)});
  let list=tasks.filter(t=>cat==="all"||t.cat===cat);
  if(win)list=list.filter(t=>{if(t.done)return false;const n=diff(t._due,now);return win==="overdue"?n<0:win==="today"?n===0:win==="week"?n>=0&&n<=7:n>=0&&n<=30});
  list.sort((a,b)=>a._due<b._due?-1:a._due>b._due?1:(a.prio==="high"?-1:1));
  const g=$("groups");g.textContent="";
  [["overdue","متأخرة"],["today","اليوم"],["week","هذا الأسبوع"],["month","هذا الشهر"],["later","لاحقاً"],["done","منجزة"]].forEach(([k,l])=>{
    const items=list.filter(t=>bucket(t,now)===k);if(!items.length)return;
    const s=el("section","group"),h=el("h2",null,l);h.append(el("small",null,String(items.length)));
    const L=el("div","list");items.forEach(t=>L.append(row(t,now)));s.append(h,L);g.append(s)});
  if(!g.children.length){const L=el("div","list");L.append(el("div","empty","ما فيه مهام في هذا التصفية."));g.append(L)}
}
function start(){renderDates();render();
  document.querySelectorAll(".stat").forEach(b=>b.addEventListener("click",()=>{win=win===b.dataset.f?null:b.dataset.f;render()}))}
$("code").focus();
})();
</script>
</body>
</html>
